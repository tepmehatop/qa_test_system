version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: qa-backend
    ports:
      - "3000:3000"
    volumes:
      - qa-data:/app/data
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: qa-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  qa-data:
